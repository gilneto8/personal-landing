# gil-neto.com production Nginx config — versioned per VPS_DEPLOYMENT_STANDARD.md
# Mirrors the live config on personal-vps (applied 2026-06-26).
#
# Deploy on the VPS:
#   ln -sf /home/<user>/personal-landing/deploy/nginx/gil-neto.com.conf \
#          /etc/nginx/sites-available/gil-neto.com
#   ln -s  /etc/nginx/sites-available/gil-neto.com /etc/nginx/sites-enabled/gil-neto.com
#   nginx -t && systemctl reload nginx
#
# Depends on server-level shared snippets (see standard §4.2):
#   /etc/nginx/snippets/security-headers.conf   (headers + gzip + HSTS)
# NOTE: security-headers.conf is included in the server block AND in each location
# that sets its own add_header — nginx drops inherited add_headers otherwise, so the
# HTML + cached-asset responses would lose the security headers without this.
# TLS certs managed by certbot (auto-renew via systemd timer).
server {
    listen 443 ssl;
    server_name gil-neto.com;
    ssl_certificate /etc/letsencrypt/live/gil-neto.com/fullchain.pem;       # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gil-neto.com/privkey.pem;     # managed by Certbot

    include snippets/security-headers.conf;

    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ =404;
        charset utf-8;
    }

    # cache static assets for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /var/www/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
    }

    location ~* \.html$ {
        root /var/www/landing;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        include snippets/security-headers.conf;
    }
}

server {
    listen 443 ssl;
    server_name www.gil-neto.com;
    ssl_certificate /etc/letsencrypt/live/gil-neto.com/fullchain.pem;       # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gil-neto.com/privkey.pem;     # managed by Certbot

    return 301 https://gil-neto.com$request_uri;
}

# HTTP redirect
server {
    if ($host = www.gil-neto.com) { return 301 https://$host$request_uri; } # managed by Certbot
    if ($host = gil-neto.com)     { return 301 https://$host$request_uri; } # managed by Certbot

    listen 80;
    server_name gil-neto.com www.gil-neto.com;
    return 301 https://$host$request_uri;
}
