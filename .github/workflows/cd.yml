name: CD
# Deploy on push to `release` → SSH to the VPS, pull, build, publish.
# Per VPS_DEPLOYMENT_STANDARD.md (static body). Runs as the `landing` user.
on:
  push:
    branches: [release]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/personal-landing
            git fetch origin release
            git reset --hard origin/release
            npm ci
            npm run build
            rm -rf /var/www/landing/*
            cp -r dist/* /var/www/landing/
            echo "deployed $(git rev-parse --short HEAD)"

  # Mirror newly published posts to dev.to + Hashnode (canonical → gil-neto.com) and open an issue
  # with the prefilled HN submit link. Gil, 2026-10-05: every post goes to dev.to, Hashnode and HN.
  syndicate:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror new posts
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          SYNDICATE_REPORT: report.md
        run: node scripts/syndicate.mjs
      - name: Open an issue with the HN link
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q 'news.ycombinator.com' report.md; then
            gh issue create -R "${{ github.repository }}" \
              --title "Mirror kit: HN + Hashnode + LinkedIn ($(date -u +%F))" --body-file report.md
          fi
